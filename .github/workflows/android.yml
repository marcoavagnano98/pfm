name: Android

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static checks
        run: sh scripts/static-check.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
